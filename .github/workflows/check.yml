name: Check

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the list of maps
        run: node tools/check-data.mjs

      - name: Check that the scripts parse
        run: |
          node --check app.js
          node --check tools/build-world.mjs
          node --check tools/check-data.mjs
